services:
  - type: web
    name: hr-onboarding-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python app.py
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: ORCHESTRATE_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false

